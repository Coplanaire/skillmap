<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillMap — De l’orientation à l’emploi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f5;color:#172439;font:16px/1.5 "DM Sans",Arial,sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button{border:0;background:none}button:focus-visible,select:focus-visible{outline:3px solid #ed785e;outline-offset:3px}header,main,footer{max-width:1320px;margin:auto;padding:0 5%}header{height:84px;display:flex;align-items:center;gap:36px}.brand{font-weight:850;font-size:29px;letter-spacing:-1.9px;display:flex;align-items:center;gap:9px}.mark{display:inline-grid;grid-template-columns:repeat(2,12px);gap:3px;transform:rotate(-9deg)}.mark i{background:#f07857;height:12px;border-radius:3px}.mark i:nth-child(3){background:#172439}.nav{font-weight:650;font-size:15px}.save{margin-left:auto;border:1px solid #d0d4d5;border-radius:30px;padding:8px 16px}.hero{position:relative;overflow:hidden;background-color:#172b43;background-image:radial-gradient(#43546a 1px,transparent 1px);background-size:18px 18px;border-radius:24px;color:white;padding:48px 5%;display:grid;grid-template-columns:1.05fr 1fr;gap:3%;align-items:center}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#192d44,transparent);pointer-events:none}.hero>*{position:relative}.over{font-size:12px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase}.hero .over{color:#ffd3bd}.hero h1{font:normal clamp(45px,4.6vw,76px)/1.02 Georgia,serif;letter-spacing:-2.8px;margin:17px 0}.hero h1 em{color:#ffa885}.hero p{color:#e0e6eb;max-width:415px}.cta{background:#ffaf8f;border-radius:9px;padding:12px 18px;font-weight:750;margin-top:7px}.map{position:relative;aspect-ratio:440/285;width:100%;max-width:520px;justify-self:center}.map svg{position:absolute;inset:0;width:100%;height:100%}.station{position:absolute;border:1px solid #8393a1;border-radius:20px;background:#20364e;color:white;padding:4px 12px;font-size:clamp(12px,1.1vw,16px);transform:translate(-50%,-50%);white-space:nowrap}.m1{top:61%;left:18%}.m2{top:25%;left:50%}.m3{top:78%;left:68%}.m4{top:35%;left:85%}.section{margin:36px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:12px}.section h2,dialog h2{font:normal clamp(30px,3vw,45px)/1.1 Georgia,serif;letter-spacing:-1.3px;margin:6px 0}.section .over{color:#627161}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{background:white;border:1px solid #d5d9d6;border-radius:22px;padding:6px 15px;font-size:14px}.filters .on{background:#203448;color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:22px;border:1px solid #d8ddd8;border-radius:16px;background:white;position:relative;transition:transform .15s}.card:hover{transform:translateY(-3px)}.icon{background:var(--bg);color:var(--ink);display:grid;place-items:center;width:48px;height:48px;border-radius:14px}.icon svg{width:27px;height:27px}.card h3{font-size:20px;letter-spacing:-.6px;margin:14px 0 4px}.card p{margin:0;color:#53616d;font-size:15px}.card .tag{position:absolute;top:25px;right:19px;color:#62716e;font-size:12px}.card b{margin-top:15px;font-size:14px}.shelf{margin:28px 0 42px;padding:23px;background:#e6ece6;border-radius:15px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.shelf strong{margin-right:auto}.shelf button,.action{background:white;border:1px solid #c5ceca;padding:8px 13px;border-radius:8px}.action{margin:6px 6px 0 0}.primary{background:#20364d;color:white}footer{padding-bottom:25px;color:#63706f;font-size:14px}dialog{max-width:min(550px,94vw);width:550px;border:0;border-radius:20px;padding:32px;color:#172439;box-shadow:0 15px 75px #17243933}dialog::backdrop{background:#17243988}.close{float:right;font-size:24px;line-height:1.2}dialog h2{margin:20px 0}dialog h3{margin-bottom:4px}dialog p{margin:5px 0 15px}select{display:block;width:100%;padding:10px;margin:5px 0 15px;border:1px solid #b8c1c4;border-radius:8px;background:white}label{font-weight:bold}.rows button{display:block;width:100%;text-align:left;background:#eff3ef;margin:8px 0;padding:12px;border-radius:8px}
@media(max-width:760px){header{height:68px;gap:12px}.nav{display:none}.save{font-size:14px}.hero{grid-template-columns:1fr;padding:30px 7% 16px}.hero h1{font-size:48px}.map{max-width:360px;margin-top:4px}.cards{grid-template-columns:repeat(2,1fr)}.card .tag{position:static;order:-1;margin-bottom:8px}.card{padding:17px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.card .tag{position:absolute}.shelf{gap:8px}.hero h1{font-size:43px}}
</style><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>SkillMap</div><button class="nav" onclick="explore()">Explorer</button><button class="nav" onclick="directory('Concours & admissions')">Concours</button><button class="save" onclick="savedPage()">Mes repères <span id="count"></span></button></header><main>
<section class="hero"><div><div class="over">Orientation · Côte d’Ivoire</div><h1>Tes études,<br><em>quel avenir ?</em></h1><p>Explore les filières, découvre les métiers qui en découlent et dessine ton parcours après le bac.</p><button class="cta" onclick="quiz()">Trouver ma voie</button></div><div class="map"><svg viewBox="0 0 440 285" aria-hidden="true"><g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path stroke="#ffac88" d="M-12 209H55Q70 209 80 198L183 96Q193 86 209 86H263Q275 86 285 74L358 0"/><path stroke="#bfb3f0" d="M66 285V247Q66 234 79 222L122 179Q135 166 147 166H245Q258 166 268 155L304 119Q315 108 332 108H452"/><path stroke="#e2c86a" d="M150 285V257Q150 245 161 235L217 179Q229 166 244 166Q262 166 272 179L300 207Q312 220 328 220H449"/></g><g fill="#1a3046" stroke="#fff" stroke-width="4"><circle cx="102" cy="176" r="7"/><circle cx="220" cy="86" r="7"/><circle cx="238" cy="166" r="10"/><circle cx="367" cy="108" r="7"/><circle cx="325" cy="220" r="7"/></g></svg><button class="station m1" onclick="quiz()">Mon profil</button><button class="station m2" onclick="explore()">Formations</button><button class="station m3" onclick="directory('Stages & emplois')">Stages</button><button class="station m4" onclick="jobs()">Métiers</button></div></section>
<section id="catalog"><div class="section"><div><div class="over">L’atlas des parcours</div><h2>Quel avenir après ma filière ?</h2></div></div><div class="filters" id="filters"></div><div class="cards" id="cards"></div></section><div class="shelf"><strong>Prépare ta prochaine étape</strong><button onclick="directory('Concours & admissions')">Concours & admissions</button><button onclick="directory('Prépas & grandes écoles')">Prépas & grandes écoles</button><button onclick="directory('Stages & emplois')">Stages & emplois</button></div></main><footer>SkillMap · De l’orientation à l’emploi</footer><dialog id="modal"><button class="close" aria-label="Fermer" onclick="modal.close()">×</button><div id="content"></div></dialog>
<script>

const data=[
['Mathématiques','Sciences','Résoudre des problèmes et construire des modèles.','Algèbre, analyse et probabilités','Statisticien|Enseignant','Comparer des données et interpréter leurs variations.|Concevoir des exercices et accompagner les élèves.','#e4e9fc','#494f92','M3 20h20M6 17l5-9 4 5 6-10'],
['Actuariat','Gestion','Mesurer les risques pour éclairer les décisions.','Probabilités, assurance et finance','Actuaire|Analyste risques','Estimer le coût futur des sinistres pour construire un tarif.|Étudier des scénarios de pertes pour éclairer une décision.','#fee4d6','#984423','M4 21V13h4v8m3 0V8h4v13m3 0V3h4v18'],
['Informatique','Numérique','Créer des logiciels et des services numériques.','Algorithmique, programmation et bases de données','Développeur|Ingénieur logiciel','Programmer et tester les fonctionnalités d’une application.|Concevoir et maintenir l’architecture d’un logiciel.','#dfede2','#38715c','M9 6l-6 6 6 6m7-12 6 6-6 6m-2-14-3 16'],
['Statistique','Sciences','Faire parler les données pour guider une décision.','Enquêtes, estimation et traitement de données','Data analyst|Chargé d’études statistiques','Transformer des données en indicateurs lisibles.|Concevoir une enquête et en analyser les résultats.','#e4e9fc','#494f92','M3 21h20M6 17v-4m5 4V6m5 11V9m5 8V3'],
['Économie','Gestion','Comprendre les choix des ménages et des entreprises.','Microéconomie, macroéconomie et économétrie','Économiste|Chargé d’études économiques','Étudier les effets d’une politique économique.|Analyser les tendances d’un marché.','#f2ead3','#816829','M3 18l6-6 5 3 8-10m-6 0h6v6'],
['Finance','Gestion','Analyser les investissements et leur financement.','Comptabilité, analyse financière et marchés','Analyste financier|Gestionnaire de portefeuille','Étudier les comptes et les perspectives d’une entreprise.|Suivre un portefeuille selon ses objectifs de risque.','#e9e1f1','#77518b','M12 3v10h10A10 10 0 1112 3m4 0v6h6a9 9 0 00-6-6']];
let records=[];try{records=JSON.parse(localStorage.skillmap||'[]')}catch{};const groups=['Toutes','Sciences','Gestion','Numérique'];function showCards(g='Toutes'){filters.innerHTML=groups.map(x=>'<button class="'+(x===g?'on':'')+'" aria-pressed="'+(x===g)+'" onclick="showCards(this.textContent)">'+x+'</button>').join('');cards.innerHTML=data.map((d,i)=>g!=='Toutes'&&d[1]!==g?'':'<button class="card" onclick="detail('+i+')"><span class="icon" style="--bg:'+d[6]+';--ink:'+d[7]+'"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2"><path d="'+d[8]+'"/></svg></span><span class="tag">'+d[1]+'</span><h3>'+d[0]+'</h3><p>'+d[2]+'</p><b>Découvrir les métiers</b></button>').join('')}
function explore(){modal.close();document.querySelector('#catalog').scrollIntoView({behavior:'smooth'})}function openBox(title,html){content.innerHTML='<div class="over">SkillMap</div><h2>'+title+'</h2>'+html;if(!modal.open)modal.showModal();modal.scrollTop=0}function detail(i){let d=data[i];openBox(d[0],'<p>'+d[2]+'</p><h3>Au programme</h3><p>'+d[3]+'.</p><h3>Métiers à explorer</h3>'+d[4].split('|').map((v,k)=>'<p><strong>'+v+'</strong><br>'+d[5].split('|')[k]+'</p>').join('')+'<button class="action primary" onclick="toggle('+i+')">'+(records.includes(i)?'Retirer de mes repères':'Enregistrer cette filière')+'</button>')}function toggle(i){records=records.includes(i)?records.filter(v=>v!==i):[...records,i];try{localStorage.skillmap=JSON.stringify(records)}catch{};counter();detail(i)}function counter(){count.textContent='('+records.length+')'}function savedPage(){openBox('Mes repères',records.length?list(records):'<p>Ouvre une fiche de filière et sélectionne « Enregistrer cette filière » pour la retrouver ici.</p>')}function list(ids){return '<div class="rows">'+ids.map(i=>'<button onclick="detail('+i+')"><b>'+data[i][0]+'</b><br>'+data[i][4].replace('|',' · ')+'</button>').join('')+'</div>'}function jobs(){openBox('Filières et métiers',list(data.map((_,i)=>i)))}
function quiz(){openBox('Trouver ma voie','<form id="form"><label for="interest">Quelle activité te plaît ?</label><select id="interest"><option value="0">Résoudre un problème logique</option><option value="2">Créer un outil numérique</option><option value="3">Enquêter à partir de données</option><option value="4">Comprendre un marché</option></select><label for="aim">Quel sujet aimerais-tu explorer ?</label><select id="aim"><option value="1">L’assurance et les risques</option><option value="5">Les investissements</option><option value="2">Les applications</option><option value="3">Les enquêtes et les prévisions</option></select><button class="action primary">Voir mes pistes</button></form>');form.onsubmit=e=>{e.preventDefault();let a=+interest.value,b=+aim.value;openBox('Tes pistes à explorer','<p>Ces filières rejoignent ton activité préférée ou le sujet que tu souhaites approfondir.</p>'+list([...new Set([a,b])])+'<button class="action" onclick="quiz()">Modifier mes réponses</button>')}}
const dirs={'Concours & admissions':[['Concours scientifique','Vérifie le niveau requis, les matières évaluées et les pièces demandées dans l’avis officiel.'],['Admission sur dossier','Prépare tes relevés, une lettre de motivation et la liste des justificatifs exigés.']],'Prépas & grandes écoles':[['Prépa scientifique','Explore un parcours intensif en mathématiques et en sciences pour préparer les concours des écoles d’ingénieurs.'],['Prépa économique et commerciale','Découvre un parcours associant économie, mathématiques et langues en vue des concours d’écoles de commerce.']],'Stages & emplois':[['Stage en assurance','Exemple de mission : analyser un portefeuille et présenter les variations de sinistralité.'],['Stage en analyse de données','Exemple de mission : nettoyer un fichier, produire un tableau de bord et expliquer tes résultats.']]};function directory(k){openBox(k,'<p>Exemples de parcours pour cette maquette.</p>'+dirs[k].map(x=>'<h3>'+x[0]+'</h3><p>'+x[1]+'</p>').join(''))}showCards();counter()

</script></html>
